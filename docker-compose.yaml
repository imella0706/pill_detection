services:
  nginx:
    image: nginx:stable
    container_name: pill-nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.4
    container_name: pill-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root file:///mlruns
      --host 0.0.0.0
      --port 5000
    restart: unless-stopped
