paths:
  data_root: data
  image_root: ${paths.data_root}/raw
  annotation_root: ${paths.data_root}/curated
  processed_root: ${paths.data_root}/processed
  datasets_root: ${paths.data_root}/datasets
  train_images_dir: ${paths.image_root}/train_images
  test_images_dir: ${paths.image_root}/test_images
