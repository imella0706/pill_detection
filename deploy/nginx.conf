events {
    worker_connections 1024;
}

http {
    # Nginx가 어떤 업스트림(FastAPI 워커)로 트래픽을 보낼지 정의하는 블록
    # Blue: 8001포트, Green: 8002포트. 초기값은 8001(Blue)로 고정.
    upstream api_backend {
        # host.docker.internal은 도커 컨테이너에서 로컬 호스트(PC)를 가리키는 특수 주소다.
        server host.docker.internal:8001; 
        
        # 추후 배포 스크립트가 이 설정 파일을 수정한 뒤, nginx -s reload를 때리면
        # Nginx가 죽지 않고 트래픽을 새로운 포트로 매끄럽게 넘겨준다 (무중단 배포의 핵심).
    }

    server {
        listen 80;
        server_name localhost;

        # 허용할 최대 이미지 크기 설정 (예: 10MB)
        client_max_body_size 10M;

        location / {
            # 위에서 정의한 api_backend 그룹으로 프록시 패스
            proxy_pass http://api_backend;
            
            # 클라이언트의 원래 정보(IP 등)를 FastAPI에 포워딩
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # 타임아웃 세팅 (AI 추론이 오래 걸릴 수 있으므로 넉넉하게 60초)
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
