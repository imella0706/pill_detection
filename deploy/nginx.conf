events {
    worker_connections 1024;
}

http {
    # Docker 내부 DNS를 사용해 API 컨테이너 이름을 요청 시점에 다시 해석한다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        # 허용할 최대 이미지 크기 설정 (예: 10MB)
        client_max_body_size 10M;

        # Nginx가 받은 요청을 어느 FastAPI 컨테이너로 보낼지 정한다.
        # deploy.sh가 이 값을 pill-api-blue:8000 또는 pill-api-green:8000으로 전환한다.
        set $api_backend "pill-api-blue:8000";

        location / {
            # 현재 선택된 FastAPI 컨테이너로 요청을 전달한다.
            proxy_pass http://$api_backend;
            
            # 클라이언트의 원본 요청 정보를 FastAPI에 전달한다.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # 추론 요청 지연을 고려해 proxy timeout을 60초로 넉넉하게 설정한다.
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
